name: Feature request
description: Propose an improvement or a new capability.
labels: [type:feature]
projects: [krizaka/4]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How it could work. Mention the governance rules (AGENTS.md) it touches, if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: privacy
    attributes:
      label: Privacy by design
      description: "What personal data does it touch, why, and for how long is it kept? Write « none » if it touches none. (ISO/IEC 27701; P-39.1 arts. 3.3, 23.)"
    validations:
      required: true
