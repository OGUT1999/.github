name: Bug report
description: Something does not work as documented.
labels: [type:bug]
projects: [krizaka/4]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 1.0.0 or a commit SHA
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, runtime versions (Java, Node, Python), deployment (local, Docker, cloud).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed.
      render: shell
