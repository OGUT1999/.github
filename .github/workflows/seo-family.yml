# The Krizaka family SEO guard, daily (krizaka-com AGENTS §2.4).
# Runs scripts/check-seo-family.mjs of krizaka-com against every indexed site and opens (or comments on) one issue
# per site when it fails. Since 2026-10-21 (epic #119) the products' public addresses are www.<product>.com (indexed)
# and dev.<product>.com is checked as a development host: robots Disallow, noindex,
# every page 308 to www (--redirects-to). The live DigitalOcean spec has twice drifted to APP_SEARCH_INDEXING=off (noindex +
# Disallow: /), which hid a site from Google: this is the alarm. Fix the live spec with doctl and the repo's .do/app.yaml.
name: SEO family

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    name: ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: www.krizaka.com, args: "" }
          - { host: ui.krizaka.com, args: "" }
          - { host: java.krizaka.com, args: "" }
          # The products' public addresses (sign-up closed). The paused products (Orochia, Yasakia, Yororis, Kachizaka) are not checked.
          - { host: www.orazaka.com, args: "" }
          - { host: www.yomizaka.com, args: "" }
          - { host: www.akinaza.com, args: "" }
          # The development hosts: not indexed, pages 308 to www, the API stays.
          - { host: dev.orazaka.com, args: "--index off --redirects-to https://www.orazaka.com" }
          - { host: dev.yomizaka.com, args: "--index off --redirects-to https://www.yomizaka.com" }
          - { host: dev.akinaza.com, args: "--index off --redirects-to https://www.akinaza.com" }
    steps:
      - name: Fetch the guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/krizaka-com
          sparse-checkout: scripts/check-seo-family.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check ${{ matrix.host }}
        id: seo
        run: |
          set +e
          read -r -a extra <<< "${ARGS}"
          node scripts/check-seo-family.mjs --base "https://${HOST}" --host "https://${HOST}" "${extra[@]}" 2>&1 | tee seo.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          HOST: ${{ matrix.host }}
          ARGS: ${{ matrix.args }}

      - name: Open or update the issue on failure
        if: steps.seo.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ matrix.host }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="SEO family check failing: ${HOST}"
          {
            echo "The daily check of \`${HOST}\` failed (${RUN_URL})."
            echo
            echo "If the log says noindex, \`Disallow: /\` or a missing sitemap, check \`APP_SEARCH_INDEXING\` in the live spec (\`doctl apps spec get <id>\`) and the repository's \`.do/app.yaml\`."
            echo
            echo '```'
            head -c 6000 seo.log
            echo '```'
          } > body.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md; fi

      - name: Fail the job
        if: steps.seo.outputs.code != '0'
        run: exit 1
