# Self-test of the reusable CI workflows (krizaka/.github#113): node-ci.yml, expo-ci.yml, python-ci.yml and java-ci.yml run against the tiny projects of
# tests/fixtures/, and the build pack (krizaka-ci.yml) against those of tests/buildpack/, the way a repository calls them. It proves the two outcomes that matter: a change that needs the heavy
# jobs RUNS them, and a change that needs none SKIPS them while the gate still reports green. Runs only when the
# workflows or the fixtures change.
name: CI workflows self-test

on:
  # Called by ci-gate.yml on every pull request (which suites apply is decided there, by scripts/ci-scope.mjs).
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/node-ci.yml"
      - ".github/workflows/java-ci.yml"
      - ".github/workflows/expo-ci.yml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/krizaka-ci.yml"
      - "actions/**"
      - ".github/workflows/selftest-ci.yml"
      - "tests/fixtures/**"
      - "tests/buildpack/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-runs:
    name: node-ci runs (npm, env, after-build, next cache)
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      duplication: true
      typecheck-script: typecheck
      next-cache-paths: tests/fixtures/node-app/.next/cache
      env: |
        FIXTURE_FLAG=on
      after-build: scripts/after-build.sh
      timeout-minutes: 10

  node-container:
    name: node-ci container (build + smoke)
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      lint-script: ""
      test-script: ""
      build-script: ""
      container: true
      container-context: tests/fixtures/node-app
      container-image: fixture:ci
      container-smoke: tests/fixtures/node-app/scripts/container-smoke.sh
      timeout-minutes: 10

  node-parallel:
    name: node-ci parallel (a leg per task) and sharded e2e
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      parallel: true
      typecheck-script: typecheck
      quality-scripts: |
        lint
        typecheck
      turbo-cache: true
      e2e-script: e2e
      e2e-shards: 2
      e2e-browsers: ""
      timeout-minutes: 10

  node-e2e-skips:
    name: node-ci skips the e2e when no UI file changed
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      parallel: true
      e2e-script: e2e
      e2e-shards: 2
      e2e-browsers: ""
      e2e-relevant: '^no-such-ui-file$'
      timeout-minutes: 10

  expo-runs:
    name: expo-ci runs (lint, typecheck, test side by side; no EAS off a tag)
    permissions:
      contents: read
    uses: ./.github/workflows/expo-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      extra-scripts: |
        lint
        build
      eas-profile: production
      timeout-minutes: 10

  python-runs:
    name: python-ci runs (pip cache, pytest-xdist, lint beside test)
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-app
      requirements: tests/fixtures/python-app/requirements.txt
      lint-command: bash lint.sh
      test-command: pytest -n 2
      timeout-minutes: 10

  python-skips:
    name: python-ci skips when nothing is relevant
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-app
      requirements: tests/fixtures/python-app/requirements.txt
      ignore: "."
      timeout-minutes: 10

  node-skips:
    name: node-ci skips when nothing is relevant
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: tests/fixtures/node-app
      ignore: "."
      timeout-minutes: 10

  java-runs:
    name: java-ci runs
    permissions:
      contents: read
    uses: ./.github/workflows/java-ci.yml
    with:
      working-directory: tests/fixtures/java-app
      timeout-minutes: 10

  java-skips:
    name: java-ci skips when nothing is relevant
    permissions:
      contents: read
    uses: ./.github/workflows/java-ci.yml
    with:
      working-directory: tests/fixtures/java-app
      ignore: "."
      timeout-minutes: 10

  pack-node:
    name: krizaka-ci detects and runs node (npm, .krizaka/ci.json env + afterBuild)
    permissions:
      contents: read
    uses: ./.github/workflows/krizaka-ci.yml
    with:
      working-directory: tests/buildpack/node

  pack-maven:
    name: krizaka-ci detects and runs maven
    permissions:
      contents: read
    uses: ./.github/workflows/krizaka-ci.yml
    with:
      working-directory: tests/buildpack/maven

  pack-python:
    name: krizaka-ci detects and runs python
    permissions:
      contents: read
    uses: ./.github/workflows/krizaka-ci.yml
    with:
      working-directory: tests/buildpack/python

  pack-iac:
    name: krizaka-ci detects and runs iac (OpenTofu fmt, validate, test; never apply)
    permissions:
      contents: read
    uses: ./.github/workflows/krizaka-ci.yml
    with:
      working-directory: tests/buildpack/iac

  pack-skips:
    name: krizaka-ci skips when .krizaka/ci.json ignores everything
    permissions:
      contents: read
    uses: ./.github/workflows/krizaka-ci.yml
    with:
      working-directory: tests/buildpack/skip

  verdict:
    name: The runs ran, the skips skipped, every gate reported
    needs: [node-runs, node-container, node-parallel, node-e2e-skips, node-skips, expo-runs, python-runs, python-skips, java-runs, java-skips, pack-node, pack-maven, pack-python, pack-iac, pack-skips]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      EVENT: ${{ github.event_name }}
      NODE_RUNS: ${{ needs.node-runs.outputs.verify-result }}
      NODE_RUNS_GATE: ${{ needs.node-runs.outputs.result }}
      CONTAINER: ${{ needs.node-container.outputs.container-result }}
      CONTAINER_GATE: ${{ needs.node-container.outputs.result }}
      PARALLEL_GATE: ${{ needs.node-parallel.outputs.result }}
      PARALLEL_E2E: ${{ needs.node-parallel.outputs.e2e-result }}
      E2E_SKIPS_GATE: ${{ needs.node-e2e-skips.outputs.result }}
      E2E_SKIPS: ${{ needs.node-e2e-skips.outputs.e2e-result }}
      EXPO_GATE: ${{ needs.expo-runs.outputs.result }}
      PYTHON_GATE: ${{ needs.python-runs.outputs.result }}
      PYTHON_SKIPS_GATE: ${{ needs.python-skips.outputs.result }}
      NODE_SKIPS: ${{ needs.node-skips.outputs.verify-result }}
      NODE_SKIPS_GATE: ${{ needs.node-skips.outputs.result }}
      JAVA_RUNS: ${{ needs.java-runs.outputs.verify-result }}
      JAVA_RUNS_GATE: ${{ needs.java-runs.outputs.result }}
      JAVA_SKIPS: ${{ needs.java-skips.outputs.verify-result }}
      JAVA_SKIPS_GATE: ${{ needs.java-skips.outputs.result }}
      PACK_NODE: ${{ needs.pack-node.outputs.stack }}/${{ needs.pack-node.outputs.verify-result }}/${{ needs.pack-node.outputs.result }}
      PACK_MAVEN: ${{ needs.pack-maven.outputs.stack }}/${{ needs.pack-maven.outputs.verify-result }}/${{ needs.pack-maven.outputs.result }}
      PACK_PYTHON: ${{ needs.pack-python.outputs.stack }}/${{ needs.pack-python.outputs.verify-result }}/${{ needs.pack-python.outputs.result }}
      PACK_IAC: ${{ needs.pack-iac.outputs.stack }}/${{ needs.pack-iac.outputs.verify-result }}/${{ needs.pack-iac.outputs.result }}
      PACK_SKIPS: ${{ needs.pack-skips.outputs.stack }}/${{ needs.pack-skips.outputs.verify-result }}/${{ needs.pack-skips.outputs.result }}
    steps:
      - run: |
          fail=0
          expect() { if [ "$2" != "$3" ]; then echo "::error::$1: expected '$3', got '$2'"; fail=1; else echo "ok  $1 = $2"; fi; }
          expect "node-runs verify"       "$NODE_RUNS"       success
          expect "node-runs gate"         "$NODE_RUNS_GATE"  success
          expect "node-container"         "$CONTAINER"       success
          expect "node-container gate"    "$CONTAINER_GATE"  success
          expect "node-parallel gate"     "$PARALLEL_GATE"   success
          expect "node-parallel e2e"      "$PARALLEL_E2E"    success
          expect "node-e2e-skips gate"    "$E2E_SKIPS_GATE"  success
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then e2eskipped=skipped; else e2eskipped=success; fi
          expect "node-e2e-skips e2e"     "$E2E_SKIPS"       "$e2eskipped"
          expect "expo gate"              "$EXPO_GATE"       success
          expect "python gate"            "$PYTHON_GATE"     success
          expect "python-skips gate"      "$PYTHON_SKIPS_GATE" success
          expect "java-runs verify"       "$JAVA_RUNS"       success
          expect "java-runs gate"         "$JAVA_RUNS_GATE"  success
          # The skip is only decided on a pull request or a branch push; a manual run executes everything.
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then skipped=skipped; else skipped=success; fi
          expect "node-skips verify"      "$NODE_SKIPS"      "$skipped"
          expect "node-skips gate"        "$NODE_SKIPS_GATE" success
          expect "java-skips verify"      "$JAVA_SKIPS"      "$skipped"
          expect "java-skips gate"        "$JAVA_SKIPS_GATE" success
          # The build pack: stack/verify/gate.
          expect "pack-node"              "$PACK_NODE"       node/success/success
          expect "pack-maven"             "$PACK_MAVEN"      maven/success/success
          expect "pack-python"            "$PACK_PYTHON"     python/success/success
          expect "pack-iac"               "$PACK_IAC"        iac/success/success
          expect "pack-skips"             "$PACK_SKIPS"      "node/$skipped/success"
          exit "$fail"
