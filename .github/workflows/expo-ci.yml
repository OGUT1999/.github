# The CI of a Krizaka Expo (React Native) app (reusable; krizaka/.github#113, #148).
#
# A repository's .github/workflows/ci.yml calls it and keeps its own triggers, concurrency and permissions:
#
#   on: { push: { branches: [main], tags: ["v*"] }, pull_request: {} }
#   jobs:
#     ci:
#       permissions: { contents: read }
#       uses: krizaka/.github/.github/workflows/expo-ci.yml@<sha> # v1.3.0
#       with:
#         typecheck-script: typecheck
#         eas-profile: production         # EAS only on a v* tag; empty: never
#       secrets:
#         EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
#
# Jobs (the first three side by side, each with the npm / pnpm cache):
#   changes     the changes.yml gate: a docs-only change skips everything (fail-open).
#   lint, typecheck, test
#   eas         ONLY on a v* tag and when `eas-profile` is set: `eas build --non-interactive --no-wait` (official expo-github-action).
#   gate        ALWAYS reports (same contract as node-ci.yml): required check `ci / CI gate`.
#
# Permissions: contents: read everywhere; the tag build uses the EXPO_TOKEN secret, nothing else.
name: expo-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      package-manager:
        description: "npm or pnpm."
        type: string
        default: npm
      working-directory:
        description: "Directory of the app (monorepo sub-folder)."
        type: string
        default: "."
      install-command:
        description: "Replaces the default install (npm ci / pnpm install --frozen-lockfile)."
        type: string
        default: ""
      lint-script:
        description: "package.json script for lint; empty skips the job."
        type: string
        default: lint
      typecheck-script:
        description: "package.json script for the typecheck; empty skips the job."
        type: string
        default: typecheck
      test-script:
        description: "package.json script for the tests; empty skips the job."
        type: string
        default: test
      extra-scripts:
        description: "Newline-separated package.json scripts run one after another in a fourth parallel job `extra` (bundle export, link checks)."
        type: string
        default: ""
      eas-profile:
        description: "EAS build profile built on a v* tag; empty: no EAS job."
        type: string
        default: ""
      eas-platform:
        description: "EAS platform: all, ios or android."
        type: string
        default: all
      relevant:
        description: "changes.yml: JavaScript RegExp, a changed file matching it needs the jobs."
        type: string
        default: "."
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the jobs."
        type: string
        default: '^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
      timeout-minutes:
        description: "Timeout of every job."
        type: number
        default: 20
    secrets:
      EXPO_TOKEN:
        description: "Expo access token, used only by the EAS job on a tag."
        required: false
    outputs:
      result:
        description: "success or failure: the gate's verdict."
        value: ${{ jobs.gate.outputs.result }}
      code:
        description: "'false' when the change needed no heavy job."
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      relevant: ${{ inputs.relevant }}
      ignore: ${{ inputs.ignore }}

  checks:
    name: ${{ format('{0}', matrix.task) }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, extra]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
      LINT: ${{ inputs.lint-script }}
      TYPECHECK: ${{ inputs.typecheck-script }}
      TEST: ${{ inputs.test-script }}
      EXTRA: ${{ inputs.extra-scripts }}
      TASK: ${{ matrix.task }}
    steps:
      - name: Which script
        id: which
        working-directory: .
        run: |
          case "$TASK" in lint) s="$LINT" ;; typecheck) s="$TYPECHECK" ;; test) s="$TEST" ;; extra) s="$EXTRA" ;; esac
          case "$PM" in npm|pnpm) ;; *) echo "::error::package-manager must be npm or pnpm, got '$PM'"; exit 1 ;; esac
          # a multi-line value goes through a delimiter
          { echo "script<<KZ_EOF"; echo "$s"; echo "KZ_EOF"; } >> "$GITHUB_OUTPUT"
          [ -n "$s" ] || echo "::notice::$TASK has no script: nothing to do"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.which.outputs.script != '' }}
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.which.outputs.script != '' && inputs.package-manager == 'pnpm' }}
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.which.outputs.script != '' }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install
        if: ${{ steps.which.outputs.script != '' }}
        env:
          INSTALL: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL" ]; then bash -c "$INSTALL"
          elif [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --prefer-offline
          else npm ci --prefer-offline --no-audit --no-fund; fi

      - name: Run
        if: ${{ steps.which.outputs.script != '' }}
        env:
          SCRIPTS: ${{ steps.which.outputs.script }}
        run: |
          while IFS= read -r script; do
            [ -z "$script" ] && continue
            "$PM" run "$script"
          done <<< "$SCRIPTS"

  eas:
    name: EAS build (tag)
    needs: [changes, checks]
    if: ${{ inputs.eas-profile != '' && startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        env:
          INSTALL: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL" ]; then bash -c "$INSTALL"
          elif [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --prefer-offline
          else npm ci --prefer-offline --no-audit --no-fund; fi

      - name: EAS build
        env:
          PROFILE: ${{ inputs.eas-profile }}
          PLATFORM: ${{ inputs.eas-platform }}
        run: eas build --non-interactive --no-wait --profile "$PROFILE" --platform "$PLATFORM"

  gate:
    name: CI gate
    needs: [changes, checks, eas]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.checks.result }}
          EAS: ${{ needs.eas.result }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES checks=$VERIFY eas=$EAS"
          # A broken gate (changes) is never a reason to fail: the checks ran in full.
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the jobs ran in full"
          case "$VERIFY" in success|skipped) ;; *) echo "::error::checks $VERIFY"; fail=1 ;; esac
          case "$EAS" in success|skipped) ;; *) echo "::error::eas $EAS"; fail=1 ;; esac
          # The checks run unless the gate answered exactly `false`: a skip without that answer is a bug, not a pass.
          if [ "$CODE" != "false" ] && [ "$VERIFY" != success ]; then
            echo "::error::checks must run when the gate did not answer false"; fail=1
          fi
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| checks | $VERIFY |"
            echo "| eas | $EAS |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
