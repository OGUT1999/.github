# « Docs are current » (krizaka/.github#351): the fact blocks of docs/standards/*.md (between `<!-- gen:<name>:start -->` and
# `<!-- gen:<name>:end -->`) are written by scripts/gen-docs.mjs from their sources, never by hand.
#
#   check    on every pull request (called by ci-gate.yml): the blocks read from this repository (the shared workflows,
#            guard-paths.json) are regenerated and must not differ. Fix: `node scripts/gen-docs.mjs`, commit.
#   refresh  weekly and on demand: the blocks read from outside (rulesets and branch protection of the org's repositories, npm)
#            are regenerated with `--remote`; when one changed, ONE pull request `chore/docs-current` is opened or updated,
#            with the token of the Krizaka Agents app (as app-videos.yml) so that its checks run.
name: docs-current

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  # Called by ci-gate.yml on every pull request (which suites apply is decided there, by scripts/ci-scope.mjs).
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Docs are current
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tests/gen-docs.test.mjs
      - run: node scripts/gen-docs.mjs --check

  refresh:
    name: Refresh the blocks read from GitHub and npm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
      # The pull request must be pushed with the app's token (the default token starts no workflow on it): the credential stays in
      # the checkout for the push below, in this short-lived job only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it; no artifact is uploaded
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Regenerate, then open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: chore/docs-current
        run: |
          node scripts/gen-docs.mjs --remote
          if git diff --quiet -- docs; then echo "docs are current"; exit 0; fi
          git config user.name "krizaka-agents[bot]"
          git config user.email "krizaka-agents[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs
          git commit -m "docs(standards): refresh the generated blocks (required checks, queue state, versions)"
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "docs(standards): refresh the generated blocks" \
              --body "Regenerated by \`node scripts/gen-docs.mjs --remote\` (docs-current.yml): the rulesets, branch protection and npm versions changed. Never hand-edit a \`gen\` block."
          fi
