# The CI of a Krizaka Java (Maven) repository (reusable; krizaka/.github#113).
#
# A repository's .github/workflows/ci.yml calls it and keeps its own triggers, concurrency and permissions:
#
#   jobs:
#     ci:
#       uses: krizaka/.github/.github/workflows/java-ci.yml@<sha> # v1.0.0
#       with:
#         workspace-component: orazaka-knowledge-service   # an Orazaka service: verified inside the workspace
#         rewrite: true
#
# What it owns (same shape as node-ci.yml):
#   changes   the changes.yml gate: a docs-only change skips the heavy job (fail-open).
#   verify    JDK + the Maven repository cache (~/.m2), then either `mvnw verify` in the repository, or — for an Orazaka
#             service — the workspace flow: the Orazaka workspace is checked out, every other repository is cloned at its
#             path, this one is placed at the commit under test, and `scripts/workspace.mjs ci <component>` builds its
#             upstream repositories from source before verifying it (the cross-repository rules run exactly as locally).
#   sonar     optional, after verify: the SonarCloud CI analysis (JaCoCo report + compiled classes uploaded by verify), quality gate awaited.
#   gate      ALWAYS reports (see node-ci.yml): green when verify succeeded or the gate legitimately skipped it.
#
# It verifies; it never publishes. A repository that publishes on a v* tag keeps a `publish` job of its own, with the
# write permissions only that job holds.
name: java-ci

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version."
        type: string
        default: "21"
      java-distribution:
        description: "setup-java distribution."
        type: string
        default: temurin
      working-directory:
        description: "Directory of the Maven project (default: the repository root). Ignored by the workspace flow."
        type: string
        default: "."
      maven-goals:
        description: "Goals of the verify step."
        type: string
        default: verify
      maven-args:
        description: "Extra arguments (e.g. -Prelease -Dgpg.skip)."
        type: string
        default: ""
      workspace-component:
        description: "An Orazaka repository name (orazaka.workspace.json): verify it inside the workspace instead of alone."
        type: string
        default: ""
      rewrite:
        description: "Fail when an OpenRewrite recipe of krizaka-parent would change code (rewrite:dryRun)."
        type: boolean
        default: false
      sonar:
        description: "Run the SonarCloud CI analysis after the checks (job `sonar`). Turn off the project's automatic analysis once it is green."
        type: boolean
        default: false
      sonar-coverage-paths:
        description: "Newline-separated files the test leg uploads for the analysis (JaCoCo report and compiled classes), relative to the project. Globs allowed."
        type: string
        default: |
          **/target/site/jacoco/jacoco.xml
          **/target/classes
      sonar-args:
        description: "Extra scanner arguments (e.g. -Dsonar.coverage.jacoco.xmlReportPaths=...). Project settings belong in sonar-project.properties."
        type: string
        default: ""
      relevant:
        description: "changes.yml: JavaScript RegExp, a changed file matching it needs the jobs."
        type: string
        default: "."
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the jobs."
        type: string
        default: '^[^/]+\.md$|^docs/|^\.changeset/|^(LICENSE|NOTICE)$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
      timeout-minutes:
        description: "Timeout of the verify job."
        type: number
        default: 45
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token (the org secret). Required when `sonar` is true; never printed."
        required: false
    outputs:
      result:
        description: "success or failure: the gate's verdict."
        value: ${{ jobs.gate.outputs.result }}
      verify-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.verify }}
      sonar-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.sonar }}
      code:
        description: "'false' when the change needed no heavy job."
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      relevant: ${{ inputs.relevant }}
      ignore: ${{ inputs.ignore }}

  verify:
    name: Verify
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      COMPONENT: ${{ inputs.workspace-component }}
    steps:
      # ── the workspace flow (an Orazaka service) ────────────────────────────────────────────────────────────────
      - name: Check out the Orazaka workspace
        if: ${{ inputs.workspace-component != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/orazaka
          path: workspace
          persist-credentials: false

      - name: Check out ${{ inputs.workspace-component }} at the commit under test
        if: ${{ inputs.workspace-component != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: incoming
          persist-credentials: false

      - name: Place the component at its workspace path
        if: ${{ inputs.workspace-component != '' }}
        working-directory: workspace
        run: |
          target=$(node -e "const m=require('./orazaka.workspace.json');const r=m.repositories.find(x=>x.name===process.env.COMPONENT);if(!r){process.exit(2)}console.log(r.path)")
          mkdir -p "$(dirname "$target")"
          mv ../incoming "$target"

      - name: Clone every other repository
        if: ${{ inputs.workspace-component != '' }}
        working-directory: workspace
        run: node scripts/workspace.mjs clone --depth 1

      # ── the plain flow ─────────────────────────────────────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.workspace-component == '' }}
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
          # The workspace holds every repository's pom: a change upstream rebuilds the key, the restore key keeps ~/.m2.
          cache-dependency-path: |
            **/pom.xml
            **/.mvn/wrapper/maven-wrapper.properties
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.workspace-component != '' }}
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ inputs.workspace-component != '' }}
        with:
          python-version: "3.12"

      - name: Verify ${{ inputs.workspace-component }} against its upstreams
        if: ${{ inputs.workspace-component != '' }}
        working-directory: workspace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/workspace.mjs ci "$COMPONENT"

      - name: Verify
        if: ${{ inputs.workspace-component == '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GOALS: ${{ inputs.maven-goals }}
          ARGS: ${{ inputs.maven-args }}
        run: |
          mvn_cmd=mvn
          [ -x ./mvnw ] && mvn_cmd=./mvnw
          # shellcheck disable=SC2086  # goals and arguments are word-split on purpose
          "$mvn_cmd" -B -ntp $ARGS $GOALS

      # The recipes live in krizaka-parent (every repository inherits them). A change a recipe would make is debt:
      # `./mvnw rewrite:run` then `./mvnw spotless:apply` (twice until clean), run the tests, commit.
      - name: OpenRewrite — no change pending
        if: ${{ inputs.rewrite }}
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          if [ -n "$COMPONENT" ]; then
            cd workspace
            target=$(node -e "const m=require('./orazaka.workspace.json');console.log(m.repositories.find(x=>x.name===process.env.COMPONENT).path)")
            cd "$target"
          else
            cd "$WORKDIR"
          fi
          mvn_cmd=mvn
          [ -x ./mvnw ] && mvn_cmd=./mvnw
          "$mvn_cmd" -B -ntp rewrite:dryRun

      - name: Where the project is
        id: base
        if: ${{ inputs.sonar }}
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          if [ -n "$COMPONENT" ]; then
            target=$(cd workspace && node -e "const m=require('./orazaka.workspace.json');console.log(m.repositories.find(x=>x.name===process.env.COMPONENT).path)")
            echo "dir=workspace/$target" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$WORKDIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the coverage for SonarCloud
        if: ${{ inputs.sonar }}
        working-directory: ${{ steps.base.outputs.dir }}
        env:
          PATHS: ${{ inputs.sonar-coverage-paths }}
          OUT: ${{ runner.temp }}/sonar-coverage.tar
        run: |
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # shellcheck disable=SC2206  # the pattern is a glob on purpose
            matches=($pattern)
            files+=("${matches[@]}")
          done <<< "$PATHS"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no coverage report found ($PATHS): the analysis runs without coverage and the new-code coverage condition will fail"
            tar -cf "$OUT" --files-from /dev/null
          else
            tar -cf "$OUT" "${files[@]}"
            echo "collected: ${files[*]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.sonar }}
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage.tar
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: SonarCloud
    needs: [changes, verify]
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code != 'false' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage

      - name: Restore the reports
        working-directory: ${{ inputs.working-directory }}
        env:
          TAR: ${{ runner.temp }}/sonar-coverage/sonar-coverage.tar
        run: tar -xf "$TAR"

      # CI analysis: the SonarCloud app still decorates the pull request and posts « SonarCloud Code Analysis »; the quality gate is awaited
      # here so the CI gate carries its verdict too.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: -Dsonar.qualitygate.wait=true ${{ inputs.sonar-args }}

  gate:
    name: CI gate
    needs: [changes, verify, sonar]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      verify: ${{ needs.verify.result }}
      sonar: ${{ needs.sonar.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_WANTED: ${{ inputs.sonar }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES verify=$VERIFY"
          # A broken gate (changes) is never a reason to fail: the heavy job ran in full.
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the job ran in full"
          case "$VERIFY" in success|skipped) ;; *) echo "::error::verify $VERIFY"; fail=1 ;; esac
          case "${SONAR:-skipped}" in success|skipped) ;; *) echo "::error::sonar $SONAR"; fail=1 ;; esac
          # The heavy job runs unless the gate answered exactly `false`: a skip without that answer is a bug, not a pass.
          if [ "$CODE" != "false" ] && [ "$VERIFY" != success ]; then
            echo "::error::verify must run when the gate did not answer false"; fail=1
          fi
          # SonarCloud runs after a green verify whenever it is wanted: a skip without the gate's `false` is a bug, not a pass.
          if [ "$CODE" != "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "$VERIFY" = success ] && [ "${SONAR:-skipped}" != success ]; then
            echo "::error::sonar must run and succeed when the gate did not answer false"; fail=1
          fi
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| verify | $VERIFY |"
            echo "| sonar | ${SONAR:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
