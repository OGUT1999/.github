# The CI of a Krizaka Python project, e.g. a media worker (reusable; krizaka/.github#113, #149).
#
#   jobs:
#     worker:
#       permissions: { contents: read }
#       uses: krizaka/.github/.github/workflows/python-ci.yml@<sha> # v1.3.0
#       with:
#         working-directory: message-authenticity/worker
#         requirements: message-authenticity/worker/requirements.txt     # pip; or package-manager: uv (pyproject + uv.lock)
#         lint-command: ruff check .
#         test-command: pytest -n auto                                    # pytest-xdist: all the runner's cores
#
# Jobs: changes (the changes.yml gate, fail-open) · lint and test SIDE BY SIDE (each installs from the cache: pip's wheel
# cache via setup-python, uv's cache via setup-uv) · gate (ALWAYS reports; required check `<caller job> / CI gate`).
# `extra-packages` installs what the tests need on top (default: pytest-xdist, so `-n auto` works).
#
# Permissions: contents: read; nothing else is asked.
name: python-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version."
        type: string
        default: "3.12"
      package-manager:
        description: "pip or uv. uv uses pyproject.toml + uv.lock (`uv sync --frozen`); pip uses `requirements`."
        type: string
        default: pip
      working-directory:
        description: "Directory the commands run in (relative to the repository root)."
        type: string
        default: "."
      requirements:
        description: "pip: newline-separated requirements files (relative to the repository root); they key the cache."
        type: string
        default: ""
      extra-packages:
        description: "pip: packages installed after the requirements (space-separated)."
        type: string
        default: "pytest-xdist"
      allow-source-builds:
        description: "Allow building packages from source at install (runs their setup scripts). Default false: wheels only."
        type: boolean
        default: false
      setup-command:
        description: "Shell command run after the install (fetch pinned models, generate fixtures); empty: none."
        type: string
        default: ""
      lint-command:
        description: "Lint command (e.g. `ruff check .`); empty skips the lint job."
        type: string
        default: ""
      test-command:
        description: "Test command (e.g. `pytest -n auto`); empty skips the test job."
        type: string
        default: "pytest -n auto"
      sonar:
        description: "Run the SonarCloud CI analysis after the checks (job `sonar`). Turn off the project's automatic analysis once it is green."
        type: boolean
        default: false
      sonar-coverage-paths:
        description: "Newline-separated files the test leg uploads for the analysis (coverage.xml written by the test command), relative to the project. Globs allowed."
        type: string
        default: coverage.xml
      sonar-args:
        description: "Extra scanner arguments (e.g. -Dsonar.python.coverage.reportPaths=coverage.xml). Project settings belong in sonar-project.properties."
        type: string
        default: ""
      relevant:
        description: "changes.yml: JavaScript RegExp, a changed file matching it needs the jobs."
        type: string
        default: "."
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the jobs."
        type: string
        default: '^[^/]+\.md$|^docs/|^\.changeset/|^(LICENSE|NOTICE)$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
      timeout-minutes:
        description: "Timeout of each job."
        type: number
        default: 20
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token (the org secret). Required when `sonar` is true; never printed."
        required: false
    outputs:
      result:
        description: "success or failure: the gate's verdict."
        value: ${{ jobs.gate.outputs.result }}
      code:
        description: "'false' when the change needed no heavy job."
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@719c761b8658dd4da07ea10b3914b9e8d0d021af # main
    with:
      relevant: ${{ inputs.relevant }}
      ignore: ${{ inputs.ignore }}

  checks:
    name: ${{ matrix.task }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test]
    permissions:
      contents: read
    env:
      PM: ${{ inputs.package-manager }}
      TASK: ${{ matrix.task }}
      LINT: ${{ inputs.lint-command }}
      TEST: ${{ inputs.test-command }}
    steps:
      - name: Which command
        id: which
        run: |
          case "$TASK" in lint) c="$LINT" ;; test) c="$TEST" ;; esac
          case "$PM" in pip|uv) ;; *) echo "::error::package-manager must be pip or uv, got '$PM'"; exit 1 ;; esac
          printf 'run=%s\n' "$([ -n "$c" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$c" ] || echo "::notice::$TASK has no command: nothing to do"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.which.outputs.run == 'true' }}
        with:
          persist-credentials: false

      # The repository's folders stay clean (docs/standards/repo-layout.md): once per run, on the lint leg.
      - name: Repository layout
        if: ${{ steps.which.outputs.run == 'true' && matrix.task == 'lint' }}
        uses: krizaka/.github/actions/repo-layout@719c761b8658dd4da07ea10b3914b9e8d0d021af # main

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: ${{ steps.which.outputs.run == 'true' && inputs.package-manager == 'uv' }}
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ steps.which.outputs.run == 'true' && inputs.package-manager == 'pip' }}
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.requirements != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.requirements }}

      - name: Install
        if: ${{ steps.which.outputs.run == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          EXTRA: ${{ inputs.extra-packages }}
          REQUIREMENTS: ${{ inputs.requirements }}
          ROOT: ${{ github.workspace }}
          SRC: ${{ inputs.allow-source-builds }}
        run: |
          # Wheels only (no setup.py of an sdist runs at install) unless the caller opts in with allow-source-builds.
          bin=(--only-binary :all:); uvbin=(--no-build)
          if [ "$SRC" = true ]; then bin=(); uvbin=(); fi
          if [ "$PM" = uv ]; then
            uv sync --frozen "${uvbin[@]}"
          else
            args=()
            while IFS= read -r f; do [ -n "$f" ] && args+=(-r "$ROOT/$f"); done <<< "$REQUIREMENTS"
            [ "${#args[@]}" -gt 0 ] && pip install "${bin[@]}" "${args[@]}"
            # shellcheck disable=SC2086  # packages are word-split on purpose
            [ -n "$EXTRA" ] && pip install "${bin[@]}" $EXTRA
          fi
          true

      - name: Setup
        if: ${{ steps.which.outputs.run == 'true' && inputs.setup-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP: ${{ inputs.setup-command }}
        run: bash -eo pipefail -c "$SETUP"

      - name: Run
        if: ${{ steps.which.outputs.run == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$TASK" in lint) c="$LINT" ;; test) c="$TEST" ;; esac
          if [ "$PM" = uv ]; then uv run --frozen bash -eo pipefail -c "$c"; else bash -eo pipefail -c "$c"; fi

      - name: Collect the coverage for SonarCloud
        if: ${{ inputs.sonar && matrix.task == 'test' && steps.which.outputs.run == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PATHS: ${{ inputs.sonar-coverage-paths }}
          OUT: ${{ runner.temp }}/sonar-coverage.tar
        run: |
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # shellcheck disable=SC2206  # the pattern is a glob on purpose
            matches=($pattern)
            files+=("${matches[@]}")
          done <<< "$PATHS"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no coverage report found ($PATHS): the analysis runs without coverage and the new-code coverage condition will fail"
            tar -cf "$OUT" --files-from /dev/null
          else
            tar -cf "$OUT" "${files[@]}"
            echo "collected: ${files[*]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.sonar && matrix.task == 'test' && steps.which.outputs.run == 'true' }}
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage.tar
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: SonarCloud
    needs: [changes, checks]
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code != 'false' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage

      - name: Restore the reports
        working-directory: ${{ inputs.working-directory }}
        env:
          TAR: ${{ runner.temp }}/sonar-coverage/sonar-coverage.tar
        run: tar -xf "$TAR"

      # CI analysis: the SonarCloud app still decorates the pull request and posts « SonarCloud Code Analysis »; the quality gate is awaited
      # here so the CI gate carries its verdict too.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: -Dsonar.qualitygate.wait=true ${{ inputs.sonar-args }}

  gate:
    name: CI gate
    needs: [changes, checks, sonar]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.checks.result }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_WANTED: ${{ inputs.sonar }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES checks=$VERIFY"
          # A broken gate (changes) is never a reason to fail: the checks ran in full.
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the jobs ran in full"
          case "$VERIFY" in success|skipped) ;; *) echo "::error::checks $VERIFY"; fail=1 ;; esac
          case "${SONAR:-skipped}" in success|skipped) ;; *) echo "::error::sonar $SONAR"; fail=1 ;; esac
          # The checks run unless the gate answered exactly `false`: a skip without that answer is a bug, not a pass.
          if [ "$CODE" != "false" ] && [ "$VERIFY" != success ]; then
            echo "::error::checks must run when the gate did not answer false"; fail=1
          fi
          # SonarCloud runs after a green verify whenever it is wanted: a skip without the gate's `false` is a bug, not a pass.
          if [ "$CODE" != "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "$VERIFY" = success ] && [ "${SONAR:-skipped}" != success ]; then
            echo "::error::sonar must run and succeed when the gate did not answer false"; fail=1
          fi
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| checks | $VERIFY |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
