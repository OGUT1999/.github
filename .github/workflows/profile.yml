# The org profile (profile/README.md): its products section is regenerated from `@krizaka/ui/sites` every week, so a new
# product appears without anyone remembering. It opens a pull request when the section changed (squash-merge it when green).
# Pull requests that touch the generator run profile-check.yml, called by ci-gate.yml. Actions are pinned by commit SHA (Dependabot keeps them current).
name: Org profile

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the job pushes the regenerated branch with the checkout credentials
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Install the newest published @krizaka/ui (resolved, then pinned to that exact version)
        run: |
          v=$(npm view @krizaka/ui version)
          npm install --prefix .sites --no-save --ignore-scripts "@krizaka/ui@$v"
      - run: node scripts/profile-products.mjs
      - name: Open a pull request when the section changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- profile/README.md; then echo "Profile already up to date."; exit 0; fi
          v=$(node -p "require('./.sites/node_modules/@krizaka/ui/package.json').version")
          branch="chore/org-profile-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add profile/README.md
          git commit -m "chore(profile): products section regenerated from @krizaka/ui $v"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "chore(profile): products section regenerated from @krizaka/ui $v" \
              --body "The family's list of sites (\`@krizaka/ui/sites\`, $v) changed: the products section of the org profile is regenerated by \`scripts/profile-products.mjs\`. Nothing else is touched."
          fi
