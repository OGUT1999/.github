# The org profile's check on a pull request: its tests, and the products section up to date with the published sites.
# Called by ci-gate.yml (profile.yml keeps the weekly regeneration, which needs write permissions a caller must not be asked for).
name: profile-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: The section is up to date with the published sites
        run: |
          v=$(npm view @krizaka/ui version)
          npm install --prefix .sites --no-save --ignore-scripts "@krizaka/ui@$v"
          node scripts/profile-products.mjs --check
