# « Cette semaine chez Krizaka » (krizaka/.github#185): every Monday, one issue lists the week's releases in French and
# English. No tokens spent; the base of the newsletter and of the blog. Idempotent: one issue per ISO week.
name: Weekly digest

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    name: Open the week's issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/weekly-digest.mjs
        env:
          GH_TOKEN: ${{ github.token }}
