# Read-only weekly report of the drift between repos.json and the org (krizaka/.github#113): scripts/gen-repos.mjs --check
# regenerates the registry from the GitHub API, docs/standards/repositories.md and deploy/apps.json, and prints the
# differences in the job summary. It never writes: a drift is fixed by a PR that runs `node scripts/gen-repos.mjs`.
name: Repository registry

on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:
  # Called by ci-gate.yml on every pull request (which suites apply is decided there, by scripts/ci-scope.mjs).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tests/repos-registry.test.mjs tests/rename-repo.test.mjs

  drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Compare repos.json with the org
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/gen-repos.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"
