# The CI and the release of a Krizaka macOS app (Tauri 2, krizaka-tauri-kit; ADR-005). Reusable: a product's
# .github/workflows/desktop.yml calls it and keeps its own triggers and permissions:
#
#   on: { pull_request: { paths: ["apps/desktop/**"] }, push: { tags: ["desktop-v*"] } }
#   jobs:
#     desktop:
#       permissions: { contents: write }
#       uses: krizaka/.github/.github/workflows/tauri-macos.yml@<sha>
#       with: { working-directory: apps/desktop, product-name: "Yomizaka" }
#       secrets: inherit
#
# check     typecheck, UI tests, Rust tests (the folder scope's traversal and symlink refusals), the front-end build.
# release   ONLY on a `desktop-v*` tag: the arm64 .dmg, attached to the GitHub release with its checksum. Signed with the
#           Developer ID and notarised when the secrets exist (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#           APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8, APPLE_TEAM_ID); ad-hoc otherwise,
#           and the release notes say so.
name: tauri-macos

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the app (it holds package.json and src-tauri)."
        type: string
        default: apps/desktop
      product-name:
        description: "The product's name, for the release title (`Yomizaka`)."
        type: string
        required: true
      tag-prefix:
        description: "The release tags start with this (`desktop-v`); the rest must match the app's version."
        type: string
        default: "desktop-v"
      node-version:
        type: string
        default: "22"
      check-script:
        description: "package.json script that runs every check (types, UI tests, Rust tests)."
        type: string
        default: check
      build-script:
        description: "package.json script that builds the signed .dmg (`tauri build --bundles dmg --target aarch64-apple-darwin`)."
        type: string
        default: "build:app"
      timeout-minutes:
        type: number
        default: 40
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  check:
    name: desktop check
    runs-on: macos-15
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Types, UI tests, Rust tests
        env:
          SCRIPT: ${{ inputs.check-script }}
        run: pnpm run "$SCRIPT"

  release:
    name: desktop dmg
    if: startsWith(github.ref, format('refs/tags/{0}', inputs.tag-prefix))
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PREFIX: ${{ inputs.tag-prefix }}
      PRODUCT: ${{ inputs.product-name }}
      BUILD: ${{ inputs.build-script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app version
        run: |
          v="${GITHUB_REF_NAME#"$PREFIX"}"
          app="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "${v%%-*}" = "$app" ] && [ "$app" = "$conf" ] || { echo "tag $v, package $app, tauri $conf must agree"; exit 1; }
      - name: Write the App Store Connect API key (notarisation)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            umask 077
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key" >> "$GITHUB_ENV"
          fi
      - name: Build the .dmg (Developer ID signed and notarised when the secrets exist, ad-hoc otherwise)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run "$BUILD"
      - name: Checksum
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        working-directory: ${{ inputs.working-directory }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          notes="$PRODUCT for macOS (Apple Silicon)."
          [ "$SIGNED" = "true" ] || notes="$notes Not signed yet: right-click the app, then Open."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 $flags --title "$PRODUCT ${GITHUB_REF_NAME#"$PREFIX"}" --notes "$notes"
          fi
