# The CI and the release of a Krizaka macOS app (Tauri 2, krizaka-tauri-kit; ADR-005). Reusable: a product's
# .github/workflows/desktop.yml calls it and keeps its own triggers and permissions:
#
#   on: { pull_request: { paths: ["apps/desktop/**"] }, push: { tags: ["v*"] } }
#   jobs:
#     desktop-pr:                # pull_request: unsigned, no secret
#       if: github.event_name == 'pull_request'
#       uses: krizaka/.github/.github/workflows/tauri-macos.yml@<sha>
#       with: { working-directory: apps/desktop, product-name: "Yomizaka", sign: false }
#     desktop-release:           # push of a tag: signed, secrets passed by name
#       if: github.event_name == 'push'
#       permissions: { contents: write }
#       uses: krizaka/.github/.github/workflows/tauri-macos.yml@<sha>
#       with: { working-directory: apps/desktop, product-name: "Yomizaka", tag-prefix: "v", sign: true }
#       secrets: { APPLE_CERTIFICATE: "${{ secrets.APPLE_CERTIFICATE }}", ... }
#
# Two modes, chosen by `sign` (default false):
#   sign: false  (pull_request) check and unsigned app build. No secret is declared to a step; passing a signing secret FAILS (guard).
#   sign: true   (push of a tag, or to main) check, then the signed and notarised .dmg in the `release` environment, which
#                holds the secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER,
#                APPLE_API_KEY, APPLE_API_KEY_P8, APPLE_TEAM_ID). Any other event or ref fails (gate). The .dmg is attached to
#                the GitHub release only on a tag. Secrets are passed by name, never inherited.
name: tauri-macos

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory of the app (it holds package.json and src-tauri)."
        type: string
        default: apps/desktop
      product-name:
        description: "The product's name, for the release title (`Yomizaka`)."
        type: string
        required: true
      tag-prefix:
        description: "The release tags start with this (`desktop-v`); the rest must match the app's version."
        type: string
        default: "desktop-v"
      node-version:
        type: string
        default: "22"
      check-script:
        description: "package.json script that runs every check (types, UI tests, Rust tests)."
        type: string
        default: check
      build-script:
        description: "package.json script that builds the .dmg (`tauri build --bundles dmg --target aarch64-apple-darwin`)."
        type: string
        default: "build:app"
      timeout-minutes:
        type: number
        default: 40
      sign:
        description: "false: build and test unsigned (pull requests, no secret). true: sign and notarise (tag or main only, `release` environment)."
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  guard:
    name: no secret on a pull request
    if: ${{ !inputs.sign }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      HAS_SECRET: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_CERTIFICATE_PASSWORD != '' || secrets.APPLE_SIGNING_IDENTITY != '' || secrets.APPLE_API_ISSUER != '' || secrets.APPLE_API_KEY != '' || secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Refuse a signing secret in unsigned mode
        run: |
          if [ "$HAS_SECRET" = "true" ]; then
            echo "A signing secret was passed with sign: false. Pass no secret on pull_request."
            exit 1
          fi

  gate:
    name: signing only on main or a tag
    if: ${{ inputs.sign }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - name: Refuse to sign outside a push to main or a tag
        run: |
          [ "$EVENT" = "push" ] || { echo "sign: true is allowed on push only, not $EVENT"; exit 1; }
          case "$REF" in refs/heads/main|refs/tags/*) ;; *) echo "sign: true is allowed on main or a tag, not $REF"; exit 1;; esac

  check:
    name: desktop check
    runs-on: macos-15
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Types, UI tests, Rust tests
        env:
          SCRIPT: ${{ inputs.check-script }}
        run: pnpm run "$SCRIPT"

  build-unsigned:
    name: desktop unsigned app build
    if: ${{ !inputs.sign }}
    needs: [guard, check]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      BUILD: ${{ inputs.build-script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned app
        run: pnpm run "$BUILD"

  release:
    name: desktop dmg
    if: ${{ inputs.sign }}
    needs: [gate, check]
    environment: release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PREFIX: ${{ inputs.tag-prefix }}
      PRODUCT: ${{ inputs.product-name }}
      BUILD: ${{ inputs.build-script }}
    steps:
      - name: Validate signing and notarisation credentials
        env:
          SIGNING_READY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          NOTARIZATION_READY: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          [ "$SIGNING_READY" = "true" ] || { echo "Developer ID signing credentials are required."; exit 1; }
          [ "$NOTARIZATION_READY" = "true" ] || { echo "App Store Connect notarisation credentials are required."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ inputs.working-directory }}/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          v="${GITHUB_REF_NAME#"$PREFIX"}"
          app="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "${v%%-*}" = "$app" ] && [ "$app" = "$conf" ] || { echo "tag $v, package $app, tauri $conf must agree"; exit 1; }
      - name: Write the App Store Connect API key (notarisation)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key" >> "$GITHUB_ENV"
      - name: Build the signed and notarised .dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run "$BUILD"
      - name: Checksum
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Attach to the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ inputs.working-directory }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          notes="$PRODUCT for macOS (Apple Silicon)."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 $flags --title "$PRODUCT ${GITHUB_REF_NAME#"$PREFIX"}" --notes "$notes"
          fi
