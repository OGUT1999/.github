# Lint of the workflows and the unit tests of the shared CI (krizaka/.github#113): actionlint (with shellcheck on every
# `run:`), the supply-chain pin check, and the tests of the gate logic. Cheap; runs whenever a workflow, a script or a test changes.
name: Workflows lint

on:
  # Called by ci-gate.yml on every pull request (which suites apply is decided there, by scripts/ci-scope.mjs).
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "actions/**"
      - "deploy/**"
      - "scripts/**"
      - "tests/**"
      - "repos.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, pins, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (shellcheck included)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Every action pinned by SHA
        run: node scripts/pin-supply-chain.mjs . --no-docker --check

      - name: Repository layout of this repository
        run: node scripts/check-repo-layout.mjs

      - uses: ./actions/security-tools

      - name: zizmor on this repository's workflows
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: zizmor --offline --min-severity medium --no-progress .

      - name: Unit tests of the shared CI
        run: node --test tests/ci-workflows.test.mjs tests/buildpack.test.mjs tests/repos-registry.test.mjs tests/rename-repo.test.mjs tests/workflows-lint.test.mjs tests/ci-scope.test.mjs actions/security-tools/security-tools.test.mjs tests/check-repo-layout.test.mjs tests/tauri-macos.test.mjs tests/weekly-digest.test.mjs actions/dup-check/dup-ratchet.test.mjs actions/release-notes/release-notes.test.mjs actions/licence-check/licence-gate.test.mjs actions/cdn-purge/cdn-purge.test.mjs actions/app-videos/app-videos.test.mjs tests/fix-needs-guard.test.mjs

      - name: krizaka-deploy — unit tests (doctl and HTTP mocked)
        working-directory: deploy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
