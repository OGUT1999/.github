# The CI of a Krizaka Node.js repository (reusable; krizaka/.github#113).
#
# A repository's .github/workflows/ci.yml calls it and keeps its own triggers, concurrency and permissions:
#
#   jobs:
#     ci:
#       uses: krizaka/.github/.github/workflows/node-ci.yml@<sha> # v1.0.0
#       with:
#         package-manager: pnpm
#         typecheck-script: typecheck
#
# What it owns, so no repository copies it:
#   changes    the changes.yml gate: a docs-only change skips the heavy jobs (fail-open: a broken gate runs everything).
#   verify     checkout, install (cached), lint, typecheck, tests, build (.next/cache restored), optional services
#              (PostgreSQL), optional browsers (Playwright, cached) and a repository script after the build.
#   container  optional: build the Dockerfile and run a repository smoke script against the image.
#   gate       ALWAYS reports. Green when every job that had to run succeeded or was legitimately skipped by the gate; red
#              on a failure, a cancellation or a heavy job skipped without the gate asking for it. Required checks and the
#              code-scanning ruleset stay satisfied on a docs-only change, and never on a broken one.
#
# Check names. GitHub names the checks of a reusable workflow « <caller job> / <job name> ». A repository whose branch
# protection still requires the former job names (« Build & Validate ») keeps them with a shim job in its ci.yml, which
# reads the gate's verdict (a failure anywhere turns every shim red; that is the price of a stable name):
#
#     validate:
#       name: Build & Validate
#       needs: ci
#       if: ${{ always() }}
#       runs-on: ubuntu-latest
#       timeout-minutes: 2
#       env:
#         RESULT: ${{ needs.ci.outputs.result }}
#       steps:
#         - run: test "$RESULT" = success
#
# Once the protection requires « ci / CI gate », the shim is deleted.
#
# Permissions: the caller job grants `contents: read` (more is never used). The called jobs ask for nothing else.
name: node-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      package-manager:
        description: "npm or pnpm. The lockfile (package-lock.json / pnpm-lock.yaml) keys the caches."
        type: string
        default: npm
      working-directory:
        description: "Directory of the package (monorepo sub-folder). Scripts, lockfile and caches are relative to it."
        type: string
        default: "."
      install-command:
        description: "Replaces the default install (npm ci / pnpm install --frozen-lockfile)."
        type: string
        default: ""
      lint-script:
        description: "package.json script run as the lint step; empty skips the step."
        type: string
        default: lint
      typecheck-script:
        description: "package.json script run as the typecheck step; empty skips it (many repositories lint with tsc already)."
        type: string
        default: ""
      test-script:
        description: "package.json script run as the test step; empty skips it."
        type: string
        default: test
      build-script:
        description: "package.json script run as the build step; empty skips it."
        type: string
        default: build
      next-cache-paths:
        description: "Newline-separated Next.js build caches to restore and save, relative to the repository root (actions/cache). Empty: none."
        type: string
        default: ""
      env:
        description: "Newline-separated KEY=VALUE written to the environment of every later step (test values only, never a secret)."
        type: string
        default: ""
      github-token-env:
        description: "Name of an environment variable set to the workflow's read-only GITHUB_TOKEN (a build that reads public GitHub data)."
        type: string
        default: ""
      postgres-image:
        description: "PostgreSQL image to start on localhost:5432 before the install (e.g. postgres:16). Empty: none."
        type: string
        default: ""
      postgres-name:
        description: "Role and database created in that PostgreSQL; the password is `ci-only-password`."
        type: string
        default: ci
      playwright:
        description: "Playwright browsers to install and cache (e.g. chromium). Empty: none."
        type: string
        default: ""
      after-build:
        description: "Path (relative to working-directory) of a bash script run after the build: SEO contract, overflow guard, anything that needs the built app."
        type: string
        default: ""
      container:
        description: "Also build the Dockerfile and smoke-test the image (job `container`)."
        type: boolean
        default: false
      container-build-args:
        description: "Newline-separated KEY=VALUE docker build arguments."
        type: string
        default: ""
      container-context:
        description: "Docker build context, relative to the repository root."
        type: string
        default: "."
      container-dockerfile:
        description: "Dockerfile, relative to the repository root. Empty: <context>/Dockerfile."
        type: string
        default: ""
      container-image:
        description: "Tag given to the image (passed to the smoke script as CI_IMAGE)."
        type: string
        default: "ci-image:ci"
      container-smoke:
        description: "Path (relative to the repository root) of a bash script run against the image. Empty: build only."
        type: string
        default: ""
      container-playwright-cache:
        description: "Restore and save the Playwright browsers cache for the smoke script."
        type: boolean
        default: false
      relevant:
        description: "changes.yml: JavaScript RegExp, a changed file matching it needs the jobs."
        type: string
        default: "."
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the jobs. Keep out of it every file a test reads."
        type: string
        default: '^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
      timeout-minutes:
        description: "Timeout of the verify job (the container job gets the same)."
        type: number
        default: 25
    outputs:
      result:
        description: "success or failure: the gate's verdict."
        value: ${{ jobs.gate.outputs.result }}
      verify-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.verify }}
      container-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.container }}
      code:
        description: "'false' when the change needed no heavy job."
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      relevant: ${{ inputs.relevant }}
      ignore: ${{ inputs.ignore }}

  verify:
    name: Verify
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      PM: ${{ inputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the inputs
        run: |
          case "$PM" in npm|pnpm) ;; *) echo "::error::package-manager must be npm or pnpm, got '$PM'"; exit 1 ;; esac

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Environment
        env:
          ENV_LINES: ${{ inputs.env }}
          TOKEN_NAME: ${{ inputs.github-token-env }}
          TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              [A-Za-z_]*=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "::error::env: '$line' is not KEY=VALUE"; exit 1 ;;
            esac
          done <<< "$ENV_LINES"
          if [ -n "$TOKEN_NAME" ]; then
            echo "::add-mask::$TOKEN"
            printf '%s=%s\n' "$TOKEN_NAME" "$TOKEN" >> "$GITHUB_ENV"
          fi

      - name: PostgreSQL
        if: ${{ inputs.postgres-image != '' }}
        env:
          IMAGE: ${{ inputs.postgres-image }}
          NAME: ${{ inputs.postgres-name }}
        run: |
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER="$NAME" -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB="$NAME" "$IMAGE"
          for _ in $(seq 1 30); do docker exec ci-postgres pg_isready -U "$NAME" && exit 0; sleep 1; done
          docker logs ci-postgres | tail -20
          exit 1

      - name: Install
        env:
          INSTALL: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL" ]; then bash -c "$INSTALL"
          elif [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile
          else npm ci; fi

      - name: Lint
        if: ${{ inputs.lint-script != '' }}
        env:
          SCRIPT: ${{ inputs.lint-script }}
        run: '"$PM" run "$SCRIPT"'

      - name: Typecheck
        if: ${{ inputs.typecheck-script != '' }}
        env:
          SCRIPT: ${{ inputs.typecheck-script }}
        run: '"$PM" run "$SCRIPT"'

      - name: Test
        if: ${{ inputs.test-script != '' }}
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: '"$PM" run "$SCRIPT"'

      # The Next.js build cache (webpack / SWC): the build reuses what the sources did not change.
      - name: Next.js build cache
        if: ${{ inputs.next-cache-paths != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.next-cache-paths }}
          key: next-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json')) }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json')) }}-

      - name: Build
        if: ${{ inputs.build-script != '' }}
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: '"$PM" run "$SCRIPT"'

      - name: Playwright browsers cache
        if: ${{ inputs.playwright != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json')) }}

      - name: Playwright browsers
        if: ${{ inputs.playwright != '' }}
        env:
          BROWSERS: ${{ inputs.playwright }}
        run: |
          # shellcheck disable=SC2086  # several browsers: word splitting is wanted
          npx playwright-core install --with-deps $BROWSERS

      - name: After the build
        if: ${{ inputs.after-build != '' }}
        env:
          SCRIPT: ${{ inputs.after-build }}
        run: bash "$SCRIPT"

  container:
    name: Container image
    needs: changes
    if: ${{ inputs.container && !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A plain `docker build`: measured on krizaka.com, the Actions-cache layer export (buildx, mode=max) cost more than it saved
      # and competes with the npm / Next.js / Playwright caches for the repository's 10 GB.
      - name: Build the image
        env:
          IMAGE: ${{ inputs.container-image }}
          CONTEXT: ${{ inputs.container-context }}
          DOCKERFILE: ${{ inputs.container-dockerfile }}
          BUILD_ARGS: ${{ inputs.container-build-args }}
        run: |
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              [A-Za-z_]*=*) args+=(--build-arg "$line") ;;
              *) echo "::error::container-build-args: '$line' is not KEY=VALUE"; exit 1 ;;
            esac
          done <<< "$BUILD_ARGS"
          docker build "${args[@]}" -f "${DOCKERFILE:-$CONTEXT/Dockerfile}" -t "$IMAGE" "$CONTEXT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Playwright browsers cache
        if: ${{ inputs.container-playwright-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json')) }}

      - name: Smoke-test the image
        if: ${{ inputs.container-smoke != '' }}
        env:
          SCRIPT: ${{ inputs.container-smoke }}
          CI_IMAGE: ${{ inputs.container-image }}
        run: bash "$SCRIPT"

  gate:
    name: CI gate
    needs: [changes, verify, container]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      verify: ${{ needs.verify.result }}
      container: ${{ needs.container.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          CONTAINER: ${{ needs.container.result }}
          CONTAINER_WANTED: ${{ inputs.container }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES verify=$VERIFY container=$CONTAINER (container wanted: $CONTAINER_WANTED)"
          # A broken gate (changes) is never a reason to fail: the heavy jobs ran in full.
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the jobs ran in full"
          for pair in "verify:$VERIFY" "container:$CONTAINER"; do
            case "${pair#*:}" in
              success|skipped) ;;
              *) echo "::error::${pair%%:*} ${pair#*:}"; fail=1 ;;
            esac
          done
          # The heavy jobs run unless the gate answered exactly `false`: a skip without that answer is a bug, not a pass.
          if [ "$CODE" != "false" ]; then
            [ "$VERIFY" = success ] || { echo "::error::verify must run when the gate did not answer false"; fail=1; }
            if [ "$CONTAINER_WANTED" = "true" ] && [ "$CONTAINER" != success ]; then
              echo "::error::container must run when the gate did not answer false"; fail=1
            fi
          fi
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| verify | $VERIFY |"
            echo "| container | $CONTAINER |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
