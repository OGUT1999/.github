# The CI of a Krizaka Node.js repository (reusable; krizaka/.github#113).
#
# A repository's .github/workflows/ci.yml calls it and keeps its own triggers, concurrency and permissions:
#
#   jobs:
#     ci:
#       uses: krizaka/.github/.github/workflows/node-ci.yml@<sha> # v1.0.0
#       with:
#         package-manager: pnpm
#         typecheck-script: typecheck
#
# Its steps are the build pack's composite actions (actions/setup, quality, test, build, after-build), the ones krizaka-ci.yml
# runs: its inputs, jobs, check names and gate do not change, so no caller changes.
#
# What it owns, so no repository copies it:
#   changes    the changes.yml gate: a docs-only change skips the heavy jobs (fail-open: a broken gate runs everything).
#   plan       a few seconds: the matrix of verify (and of the e2e shards) from the inputs.
#   verify     checkout, install (cached), lint, typecheck, tests, build (.next/cache restored), optional services
#              (PostgreSQL), optional browsers (Playwright, cached) and a repository script after the build. With
#              `parallel: true` it is a matrix: one leg per task (lint, typecheck, test, build), run side by side.
#   e2e        optional: Playwright, `e2e-shards` legs in parallel, only when a changed file matches `e2e-relevant`.
#   container  optional, AFTER verify (no image is built when lint or tests fail): build the Dockerfile, scan the image with Trivy
#              (fails on a fixable HIGH or CRITICAL finding, minus the repository's written allowlist), keep an SBOM
#              artifact, run a repository smoke script against the image. PR images are never published: the image is
#              loaded into the runner's daemon only; the deploy builds from main after the merge.
#   sonar      optional, AFTER verify: the SonarCloud CI analysis with the coverage the test leg uploaded, and the quality gate
#              awaited. (CodeQL is not here: it scans the source, needs neither build nor tests, and stays its own required check.)
#   gate       ALWAYS reports (verify, duplication, e2e, container and sonar). Green when every job that had to run succeeded or was legitimately skipped by the gate; red
#              on a failure, a cancellation or a heavy job skipped without the gate asking for it. Required checks and the
#              code-scanning ruleset stay satisfied on a docs-only change, and never on a broken one.
#
# Check names. GitHub names the checks of a reusable workflow « <caller job> / <job name> ». A repository whose branch
# protection still requires the former job names (« Build & Validate ») keeps them with a shim job in its ci.yml, which
# reads the gate's verdict (a failure anywhere turns every shim red; that is the price of a stable name):
#
#     validate:
#       name: Build & Validate
#       needs: ci
#       if: ${{ always() }}
#       runs-on: ubuntu-latest
#       timeout-minutes: 2
#       env:
#         RESULT: ${{ needs.ci.outputs.result }}
#       steps:
#         - run: test "$RESULT" = success
#
# Once the protection requires « ci / CI gate », the shim is deleted.
#
# Permissions: the caller job grants `contents: read` (more is never used). The called jobs ask for nothing else.
name: node-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      package-manager:
        description: "npm or pnpm. The lockfile (package-lock.json / pnpm-lock.yaml) keys the caches."
        type: string
        default: npm
      working-directory:
        description: "Directory of the package (monorepo sub-folder). Scripts, lockfile and caches are relative to it."
        type: string
        default: "."
      install-command:
        description: "Replaces the default install (npm ci / pnpm install --frozen-lockfile)."
        type: string
        default: ""
      lint-script:
        description: "package.json script run as the lint step; empty skips the step."
        type: string
        default: lint
      typecheck-script:
        description: "package.json script run as the typecheck step; empty skips it (many repositories lint with tsc already)."
        type: string
        default: ""
      test-script:
        description: "package.json script run as the test step; empty skips it."
        type: string
        default: test
      build-script:
        description: "package.json script run as the build step; empty skips it."
        type: string
        default: build
      next-cache-paths:
        description: "Newline-separated Next.js build caches to restore and save, relative to the repository root (actions/cache). Empty: none."
        type: string
        default: ""
      env:
        description: "Newline-separated KEY=VALUE written to the environment of every later step (test values only, never a secret)."
        type: string
        default: ""
      github-token-env:
        description: "Name of an environment variable set to the workflow's read-only GITHUB_TOKEN (a build that reads public GitHub data)."
        type: string
        default: ""
      postgres-image:
        description: "PostgreSQL image to start on localhost:5432 before the install (e.g. postgres:16). Empty: none."
        type: string
        default: ""
      postgres-name:
        description: "Role and database created in that PostgreSQL; the password is `ci-only-password`."
        type: string
        default: ci
      playwright:
        description: "Playwright browsers to install and cache (e.g. chromium). Empty: none."
        type: string
        default: ""
      after-build:
        description: "Path (relative to working-directory) of a bash script run after the build: SEO contract, overflow guard, anything that needs the built app."
        type: string
        default: ""
      container:
        description: "Also build the Dockerfile and smoke-test the image (job `container`)."
        type: boolean
        default: false
      container-build-args:
        description: "Newline-separated KEY=VALUE docker build arguments."
        type: string
        default: ""
      container-context:
        description: "Docker build context, relative to the repository root."
        type: string
        default: "."
      container-dockerfile:
        description: "Dockerfile, relative to the repository root. Empty: <context>/Dockerfile."
        type: string
        default: ""
      container-image:
        description: "Tag given to the image (passed to the smoke script as CI_IMAGE)."
        type: string
        default: "ci-image:ci"
      container-smoke:
        description: "Path (relative to the repository root) of a bash script run against the image. Empty: build only."
        type: string
        default: ""
      container-playwright-cache:
        description: "Restore and save the Playwright browsers cache for the smoke script."
        type: boolean
        default: false
      container-scan-allowlist:
        description: "Trivy allowlist (.trivyignore.yaml: id, statement, expired_at per accepted finding), relative to the repository root. Used when the file exists."
        type: string
        default: ".trivyignore.yaml"
      sonar:
        description: "Run the SonarCloud CI analysis after verify (job `sonar`). Turn off the project's automatic analysis once it is green."
        type: boolean
        default: false
      sonar-coverage-paths:
        description: "Newline-separated coverage reports (lcov) the test leg uploads for the analysis, relative to working-directory. Globs allowed."
        type: string
        default: "coverage/lcov.info"
      sonar-args:
        description: "Extra scanner arguments (e.g. -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info). Project settings belong in sonar-project.properties."
        type: string
        default: ""
      relevant:
        description: "changes.yml: JavaScript RegExp, a changed file matching it needs the jobs."
        type: string
        default: "."
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the jobs. Keep out of it every file a test reads."
        type: string
        default: '^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
      duplication:
        description: "Run the duplicate-code check (actions/dup-check: jscpd + the repository's dup-ratchet.json, which may only go down)."
        type: boolean
        default: false
      duplication-paths:
        description: "Space-separated paths the duplicate-code check scans (default: the whole checkout; tests and generated code are ignored by the shared config)."
        type: string
        default: "."
      quality-scripts:
        description: "Newline-separated package.json scripts run in a `quality` leg (depcruise, ast-grep, the ratchets: clean imports, debt counters that only go down). Part of the serial job when parallel is false."
        type: string
        default: ""
      parallel:
        description: "Run lint, typecheck, test and build as parallel jobs (one install each, from the cache) instead of one serial job. Leave false when the tests read the build output."
        type: boolean
        default: false
      turbo-cache:
        description: "Restore and save .turbo (Turborepo's local cache, actions/cache) in the test and build jobs."
        type: boolean
        default: false
      e2e-script:
        description: "package.json script run by the sharded browser job (`<pm> run <script> -- --shard=i/n`); empty: no such job. It starts what it needs (webServer) and builds if it must."
        type: string
        default: ""
      e2e-shards:
        description: "Number of parallel shards of the e2e job (1 to 8)."
        type: number
        default: 1
      e2e-relevant:
        description: "JavaScript RegExp: the e2e job runs only when a changed file matches it (the UI files). Default: every change that needs jobs."
        type: string
        default: "."
      e2e-browsers:
        description: "Playwright browsers installed (and cached) for the e2e job; empty: none installed."
        type: string
        default: chromium
      timeout-minutes:
        description: "Timeout of the verify job (the container and e2e jobs get the same)."
        type: number
        default: 25
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token (the org secret). Required when `sonar` is true; never printed."
        required: false
    outputs:
      result:
        description: "success or failure: the gate's verdict."
        value: ${{ jobs.gate.outputs.result }}
      verify-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.verify }}
      duplication-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.duplication }}
      container-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.container }}
      e2e-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.e2e }}
      sonar-result:
        description: "success, failure, cancelled or skipped."
        value: ${{ jobs.gate.outputs.sonar }}
      code:
        description: "'false' when the change needed no heavy job."
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      relevant: ${{ inputs.relevant }}
      ignore: ${{ inputs.ignore }}

  docker-changes:
    name: Changed Docker files
    if: ${{ inputs.container }}
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      # What can break an image build whatever the caller's `ignore` says: the Dockerfile and .dockerignore, the manifests and
      # lockfiles the install COPYs, the workspace definition. Any other path a COPY names is covered by `relevant: .` of the main gate
      # (deleted paths are listed too).
      relevant: '(^|/)(Dockerfile[^/]*|\.dockerignore|package\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml|package-lock\.json|\.npmrc)$'
      ignore: ""

  ui-changes:
    name: Changed UI files
    if: ${{ inputs.e2e-script != '' }}
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@ccd224612f5bb9db815335654f359a595a597fbb # main
    with:
      relevant: ${{ inputs.e2e-relevant }}
      ignore: ${{ inputs.ignore }}

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          PARALLEL: ${{ inputs.parallel }}
          LINT: ${{ inputs.lint-script }}
          QUALITY: ${{ inputs.quality-scripts }}
          TYPECHECK: ${{ inputs.typecheck-script }}
          TEST: ${{ inputs.test-script }}
          BUILD: ${{ inputs.build-script }}
          AFTER: ${{ inputs.after-build }}
          SHARDS: ${{ inputs.e2e-shards }}
        run: |
          if [ "$PARALLEL" = true ]; then
            tasks=()
            [ -n "$LINT" ] && tasks+=(lint)
            [ -n "$QUALITY" ] && tasks+=(quality)
            [ -n "$TYPECHECK" ] && tasks+=(typecheck)
            [ -n "$TEST" ] && tasks+=(test)
            { [ -n "$BUILD" ] || [ -n "$AFTER" ]; } && tasks+=(build)
            [ "${#tasks[@]}" -gt 0 ] || tasks=(all)
            json=$(printf '"%s",' "${tasks[@]}"); json="[${json%,}]"
          else
            json='["all"]'
          fi
          case "$SHARDS" in [1-8]) ;; *) echo "::error::e2e-shards must be 1 to 8, got '$SHARDS'"; exit 1 ;; esac
          shards=""; for i in $(seq 1 "$SHARDS"); do shards="${shards:+$shards,}$i"; done; shards="[${shards}]"
          echo "tasks=$json" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "tasks=$json shards=$shards"

  verify:
    name: ${{ matrix.task == 'all' && 'Verify' || format('Verify ({0})', matrix.task) }}
    needs: [changes, plan]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    permissions:
      contents: read
    env:
      PM: ${{ inputs.package-manager }}
    # The steps are the build pack's (actions/setup, quality, test, build, after-build), in the order and under the conditions
    # they always had: a leg runs only its task's steps (`all`: every step).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: krizaka/.github/actions/setup@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          stack: node
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          install-command: ${{ inputs.install-command }}
          env: ${{ inputs.env }}
          github-token-env: ${{ inputs.github-token-env }}
          postgres-image: ${{ (matrix.task == 'all' || matrix.task == 'test' || matrix.task == 'build') && inputs.postgres-image || '' }}
          postgres-name: ${{ inputs.postgres-name }}

      - uses: krizaka/.github/actions/quality@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          lint-script: ${{ (matrix.task == 'all' || matrix.task == 'lint') && inputs.lint-script || '' }}
          quality-scripts: ${{ (matrix.task == 'all' || matrix.task == 'quality') && inputs.quality-scripts || '' }}
          typecheck-script: ${{ (matrix.task == 'all' || matrix.task == 'typecheck') && inputs.typecheck-script || '' }}

      # Turborepo's local cache (every leg but lint), then the tests (the test and build legs).
      - uses: krizaka/.github/actions/test@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          turbo-cache: ${{ inputs.turbo-cache && matrix.task != 'lint' }}
          cache-scope: ${{ matrix.task }}
          test-script: ${{ (matrix.task == 'all' || matrix.task == 'test' || matrix.task == 'build') && inputs.test-script || '' }}

      - uses: krizaka/.github/actions/build@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          next-cache-paths: ${{ (matrix.task == 'all' || matrix.task == 'build') && inputs.next-cache-paths || '' }}
          build-script: ${{ (matrix.task == 'all' || matrix.task == 'build') && inputs.build-script || '' }}

      - uses: krizaka/.github/actions/after-build@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          playwright: ${{ (matrix.task == 'all' || matrix.task == 'build') && inputs.playwright || '' }}
          script: ${{ (matrix.task == 'all' || matrix.task == 'build') && inputs.after-build || '' }}

      # The coverage the analysis reads: only the leg that ran the tests uploads it, as one tar that keeps the paths.
      - name: Collect the coverage for SonarCloud
        if: ${{ inputs.sonar && (matrix.task == 'all' || matrix.task == 'test') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PATHS: ${{ inputs.sonar-coverage-paths }}
          OUT: ${{ runner.temp }}/sonar-coverage.tar
        run: |
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # shellcheck disable=SC2206  # the pattern is a glob on purpose
            matches=($pattern)
            files+=("${matches[@]}")
          done <<< "$PATHS"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no coverage report found ($PATHS): the analysis runs without coverage and the new-code coverage condition will fail"
            tar -cf "$OUT" --files-from /dev/null
          else
            tar -cf "$OUT" "${files[@]}"
            echo "coverage: ${files[*]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.sonar && (matrix.task == 'all' || matrix.task == 'test') }}
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: ${{ format('E2E ({0}/{1})', matrix.shard, inputs.e2e-shards) }}
    needs: [changes, ui-changes, plan]
    if: ${{ inputs.e2e-script != '' && !cancelled() && needs.changes.outputs.code != 'false' && needs.ui-changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    permissions:
      contents: read
    env:
      PM: ${{ inputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: krizaka/.github/actions/setup@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          stack: node
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          install-command: ${{ inputs.install-command }}
          env: ${{ inputs.env }}
          postgres-image: ${{ inputs.postgres-image }}
          postgres-name: ${{ inputs.postgres-name }}

      # The Next.js cache only (no build here: the e2e script builds if it must).
      - uses: krizaka/.github/actions/build@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          next-cache-paths: ${{ inputs.next-cache-paths }}

      - uses: krizaka/.github/actions/after-build@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          playwright: ${{ inputs.e2e-browsers }}

      - uses: krizaka/.github/actions/test@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          test-script: ${{ inputs.e2e-script }}
          test-args: ${{ format('--shard={0}/{1}', matrix.shard, inputs.e2e-shards) }}

  duplication:
    name: Duplicate code
    needs: changes
    if: ${{ inputs.duplication && !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: krizaka/.github/actions/dup-check@d468b5eb10b785034c2834f31c0dd671b51ca0fe # main
        with:
          paths: ${{ inputs.duplication-paths }}
          working-directory: ${{ inputs.working-directory }}

  container:
    name: Container image
    # After verify: no image is built when lint or tests fail. A skipped verify (the gate said no code changed) still lets a Docker-file change build.
    needs: [changes, docker-changes, verify]
    if: ${{ inputs.container && !cancelled() && (needs.changes.outputs.code != 'false' || needs.docker-changes.outputs.code != 'false') && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # buildx with the Actions cache (actions/build): layers are restored on every run and written on main only,
      # so a pull request never pays for the export. The image is loaded into the local daemon (never pushed) for the scan and the smoke script.
      - uses: krizaka/.github/actions/build@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          container: "true"
          container-context: ${{ inputs.container-context }}
          container-dockerfile: ${{ inputs.container-dockerfile }}
          container-image: ${{ inputs.container-image }}
          container-build-args: ${{ inputs.container-build-args }}

      - name: Allowlist of accepted findings
        id: allow
        env:
          FILE: ${{ inputs.container-scan-allowlist }}
        run: |
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then echo "file=$FILE" >> "$GITHUB_OUTPUT"; echo "allowlist: $FILE"; else echo "file=" >> "$GITHUB_OUTPUT"; echo "no allowlist: every fixable HIGH or CRITICAL finding fails"; fi

      # The SBOM first (CycloneDX), kept as an artifact whatever the scan says.
      - name: SBOM of the image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.container-image }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

      # Fixable HIGH and CRITICAL findings fail the job. What has no fix yet does not block; an accepted exception is written
      # in the allowlist with its reason and an expiry, never silenced here.
      - name: Scan the image (fixable HIGH and CRITICAL fail)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.container-image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: ${{ steps.allow.outputs.file }}

      # Node (and pnpm) only for a smoke script that needs them; a build-only job needs neither.
      - uses: krizaka/.github/actions/setup@147c1925368d98fb07887257549db36556644cc5 # main
        if: ${{ inputs.container-smoke != '' }}
        with:
          stack: node
          install: "false"
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}

      - uses: krizaka/.github/actions/after-build@147c1925368d98fb07887257549db36556644cc5 # main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          playwright-cache: ${{ inputs.container-playwright-cache }}
          script-directory: "."
          script: ${{ inputs.container-smoke }}
          image: ${{ inputs.container-image }}

  sonar:
    name: SonarCloud
    needs: [changes, verify]
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code != 'false' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage

      - name: Restore the coverage reports
        working-directory: ${{ inputs.working-directory }}
        env:
          TAR: ${{ runner.temp }}/sonar-coverage/sonar-coverage.tar
        run: tar -xf "$TAR"

      # CI analysis: the SonarCloud app still decorates the pull request and posts « SonarCloud Code Analysis »; the quality gate is awaited
      # here so the CI gate carries its verdict too.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: -Dsonar.qualitygate.wait=true ${{ inputs.sonar-args }}

  gate:
    name: CI gate
    needs: [changes, ui-changes, docker-changes, plan, verify, e2e, duplication, container, sonar]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      verify: ${{ needs.verify.result }}
      container: ${{ needs.container.result }}
      e2e: ${{ needs.e2e.result }}
      duplication: ${{ needs.duplication.result }}
      sonar: ${{ needs.sonar.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          CONTAINER: ${{ needs.container.result }}
          CONTAINER_WANTED: ${{ inputs.container }}
          E2E: ${{ needs.e2e.result }}
          E2E_WANTED: ${{ inputs.e2e-script != '' }}
          UI_CODE: ${{ needs.ui-changes.outputs.code }}
          DOCKER_CODE: ${{ needs.docker-changes.outputs.code }}
          PLAN: ${{ needs.plan.result }}
          DUP: ${{ needs.duplication.result }}
          DUP_WANTED: ${{ inputs.duplication }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_WANTED: ${{ inputs.sonar }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES plan=${PLAN:-success} verify=$VERIFY container=$CONTAINER (container wanted: $CONTAINER_WANTED) e2e=${E2E:-skipped} (wanted: ${E2E_WANTED:-false}, ui=${UI_CODE:-unknown})"
          [ "${PLAN:-success}" = success ] || { echo "::error::plan ${PLAN}"; fail=1; }
          # A broken gate (changes) is never a reason to fail: the heavy jobs ran in full.
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the jobs ran in full"
          for pair in "verify:$VERIFY" "container:$CONTAINER" "e2e:${E2E:-skipped}" "duplication:${DUP:-skipped}" "sonar:${SONAR:-skipped}"; do
            case "${pair#*:}" in
              success|skipped) ;;
              *) echo "::error::${pair%%:*} ${pair#*:}"; fail=1 ;;
            esac
          done
          # The heavy jobs run unless the gate answered exactly `false`: a skip without that answer is a bug, not a pass.
          if [ "$CODE" != "false" ]; then
            [ "$VERIFY" = success ] || { echo "::error::verify must run when the gate did not answer false"; fail=1; }
          fi
          # The image is built unless NEITHER gate answered false: a Dockerfile, a manifest or a lockfile always builds it.
          # It waits for verify: when verify failed, the image was rightly not built and verify already made the gate red.
          if [ "$CONTAINER_WANTED" = "true" ] && [ "$VERIFY" != failure ] && [ "$VERIFY" != cancelled ] && { [ "$CODE" != "false" ] || [ "${DOCKER_CODE:-}" != "false" ]; } && [ "$CONTAINER" != success ]; then
            echo "::error::container must run when a gate did not answer false"; fail=1
          fi
          # The e2e job runs unless the main gate or the UI gate answered exactly `false`.
          if [ "$CODE" != "false" ] && [ "${E2E_WANTED:-false}" = "true" ] && [ "${UI_CODE:-}" != "false" ] && [ "${E2E:-skipped}" != success ]; then
            echo "::error::e2e must run when no gate answered false"; fail=1
          fi
          if [ "$CODE" != "false" ] && [ "${DUP_WANTED:-false}" = "true" ] && [ "${DUP:-skipped}" != success ]; then
            echo "::error::duplication must run when the gate did not answer false"; fail=1
          fi
          # SonarCloud runs after a green verify whenever it is wanted: a skip without the gate's `false` is a bug, not a pass.
          if [ "$CODE" != "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "$VERIFY" = success ] && [ "${SONAR:-skipped}" != success ]; then
            echo "::error::sonar must run and succeed when the gate did not answer false"; fail=1
          fi
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| verify | $VERIFY |"
            echo "| container | $CONTAINER |"
            echo "| duplication | ${DUP:-skipped} |"
            echo "| e2e | ${E2E:-skipped} (ui=${UI_CODE:-unknown}) |"
            echo "| sonar | ${SONAR:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
