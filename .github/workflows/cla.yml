# The CLA check of the Krizaka product repositories (ADR-012 §4, krizaka/.github#293). Reusable: a product repository's
# .github/workflows/cla.yml calls it (template: workflow-templates/cla.yml) on pull_request_target and issue_comment.
#
# A contributor who has not signed gets a comment with the link to CLA.md and the sentence to post; the check turns green
# once they post it. Signatures are kept in one private repository of the org (krizaka/cla-signatures,
# signatures/v1/cla.json), written with a Krizaka Agents app token scoped to that repository only (no personal token, no extra secret).
# Members of the org and the bots are allowlisted: their work is covered by the founder assignment and the subcontractor
# assignments (docs/legal/ai-authorship.md), not by the CLA.
#
# krizaka/cla-signatures exists (private, created 2026-10-26). The caller passes `secrets: inherit` (RELEASE_APP_PRIVATE_KEY).
name: cla

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cla:
    name: CLA
    if: ${{ (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Krizaka CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: krizaka
          repositories: cla-signatures
          permission-contents: write
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app.outputs.token }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/krizaka/.github/blob/main/CLA.md
          branch: main
          remote-organization-name: krizaka
          remote-repository-name: cla-signatures
          allowlist: Wu-sama,oussamaABID,krizaka-agents[bot],dependabot[bot],github-actions[bot],renovate[bot]
          custom-pr-sign-comment: I have read the Krizaka CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your contribution. This is a Krizaka product repository: before we can merge external code, please read the
            [Krizaka Contributor Licence Agreement](https://github.com/krizaka/.github/blob/main/CLA.md)
            ([français](https://github.com/krizaka/.github/blob/main/CLA.fr.md)) and sign it by posting the sentence below as a comment.
            You keep your copyright; the agreement is a licence. Merci !
          custom-allsigned-prcomment: All contributors have signed the Krizaka CLA. Thank you.
          lock-pullrequest-aftermerge: false
