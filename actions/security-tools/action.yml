name: Security tools
description: Installs gitleaks and zizmor at the versions pinned by the org (checksum verified). One place for the pins (krizaka/.github#324, #325).
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        sudo install /tmp/gitleaks /usr/local/bin/gitleaks
    - name: Install zizmor
      shell: bash
      run: |
        python3 -m pip install --quiet --only-binary :all: "zizmor==1.31.1"
