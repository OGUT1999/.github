# Duplicate-code check with a ratchet (krizaka/.github#169): jscpd with the org's thresholds, the count compared with the repository's
# dup-ratchet.json (it may only go down). TypeScript, JavaScript, Java and Python.
#
#   - uses: actions/checkout@<sha>
#   - uses: krizaka/.github/actions/dup-check@<sha> # v1.5.0
#     with:
#       paths: "apps packages"      # default: the whole checkout (the shared config ignores tests, build output and generated code)
#
# First time in a repository: `node <this folder>/dup-ratchet.mjs --update`, commit dup-ratchet.json. Needs only Node (on every runner).
name: dup-check
description: Fail when a repository's duplicated lines rise above its baseline (jscpd).
author: Krizaka

inputs:
  paths:
    description: "Space-separated paths to scan."
    default: "."
  baseline:
    description: "The ratchet file, relative to the working directory."
    default: dup-ratchet.json
  working-directory:
    description: "Directory the scan runs in."
    default: "."

runs:
  using: composite
  steps:
    - name: Duplicate code (jscpd, ratchet)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DUP_PATHS: ${{ inputs.paths }}
        DUP_BASELINE: ${{ inputs.baseline }}
      run: node "$GITHUB_ACTION_PATH/dup-ratchet.mjs" --paths "$DUP_PATHS" --baseline "$DUP_BASELINE"
